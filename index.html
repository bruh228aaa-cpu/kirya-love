<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love for Kirill</title>
    <style>
        body {
            background-color: #ffb6c1; /* Светло-розовый фон */
            font-family: 'Comic Sans MS', 'Arial', sans-serif; /* Милый шрифт */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
            position: relative;
        }

        .container {
            background-color: rgba(255, 255, 255, 0.8);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 0 20px #ff69b4, 0 0 40px #ff1493;
            border: 4px solid #ff1493;
            z-index: 10;
            max-width: 90%;
        }

        h1 {
            color: #ff1493;
            font-size: 3em;
            margin-top: 0;
            text-shadow: 2px 2px 0px #fff, 4px 4px 0px #ff69b4;
        }

        .heart {
            color: #ff1493;
            font-size: 2em;
            animation: beat 1s infinite alternate;
            display: inline-block;
        }

        .photos {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .photo-frame {
            width: 200px;
            height: 200px;
            border: 5px dashed #ff69b4;
            border-radius: 15px;
            overflow: hidden;
            background-color: #ffe4e1;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px #ff69b4;
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        p {
            color: #c71585;
            font-size: 1.5em;
            font-weight: bold;
            line-height: 1.5;
        }

        /* Падающие сердечки на фоне */
        .falling-heart {
            position: absolute;
            top: -10vh;
            color: #ff1493;
            font-size: 24px;
            animation: fall linear infinite;
            opacity: 0.6;
        }

        @keyframes beat {
            0% { transform: scale(1); }
            100% { transform: scale(1.3); }
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); }
            100% { transform: translateY(110vh) rotate(360deg); }
        }
    </style>
    <!-- Плеер для фоновой музыки -->
    <audio id="bg-music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>
    <script>
        document.body.addEventListener('click', function() {
            var audio = document.getElementById('bg-music');
            audio.volume = 0.3; // Громкость 30%
            if (audio.paused) {
                audio.play();
            }
        }, { once: true });
    </script>
</head>
<body>

    <!-- Скрипт для генерации падающих сердечек -->
    <script>
        for (let i = 0; i < 30; i++) {
            let heart = document.createElement('div');
            heart.className = 'falling-heart';
            heart.innerHTML = '♥';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
            heart.style.animationDelay = (Math.random() * 5) + 's';
            document.body.appendChild(heart);
        }
    </script>

    <div class="container">
        <h1>I Love Kirill <span class="heart">♥</span></h1>
        
        <div class="photos">
            <!-- Сюда вставляются твои фотки. Если их нет, будут пустые рамочки -->
            <div class="photo-frame">
                <img src="photo1.jpg" alt="Кирилл 1" onerror="this.style.display='none'">
            </div>
            <div class="photo-frame">
                <img src="photo2.jpg" alt="Кирилл 2" onerror="this.style.display='none'">
            </div>
        </div>

        <p>
            Ты самый лучший <span class="heart" style="font-size:1em;">♥</span><br>
            Спасибо, что ты есть.<br>
            Мой самый любимый мальчик.
        </p>
    </div>

</body>
</html>
